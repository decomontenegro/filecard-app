<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado! — filecard.app</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    .emoji { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; color: #aaa; line-height: 1.6; }
    .tag {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #f0c040;
      color: #f0c040;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 100px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎖️</div>
    <h1>Obrigado pela resposta!</h1>
    <p>Sua opinião vai diretamente moldar o app. Assim que o beta estiver pronto, você será um dos primeiros a saber.</p>
    <div class="tag">filecard.app — em breve</div>
  </div>
</body>
</html>
